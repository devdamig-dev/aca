name: fix-unified-css-cascade

on:
  push:
    branches:
      - chore/unify-css-seo-gtm

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore nested gate refinement into unified stylesheet
        run: |
          git show origin/main:css/gate-refinement.css > /tmp/gate-refinement.css
          python3 - <<'PY'
          from pathlib import Path
          styles = Path('css/styles.css')
          text = styles.read_text(encoding='utf-8')
          marker = '/* ===== prize-refinement.css ===== */'
          gate = Path('/tmp/gate-refinement.css').read_text(encoding='utf-8').strip()
          block = f'/* ===== gate-refinement.css ===== */\n{gate}\n\n\n'
          if '/* ===== gate-refinement.css ===== */' not in text:
              text = text.replace(marker, block + marker, 1)
              styles.write_text(text, encoding='utf-8')
          PY

      - name: Commit cascade fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/styles.css
          git commit -m "fix: preserve nested gate CSS in unified stylesheet" || exit 0
          git push
