name: Apply typography stylesheet link

on:
  push:
    branches:
      - feature/figma-refinement
    paths:
      - .github/workflows/apply-typography-link.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/figma-refinement
      - name: Insert typography stylesheet after base stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          link = '  <link rel="stylesheet" href="css/typography.css" />\n'
          if 'css/typography.css' not in s:
              marker = '  <link rel="stylesheet" href="css/styles.css" />\n'
              if marker in s:
                  s = s.replace(marker, marker + link, 1)
              else:
                  s = s.replace('</head>', link + '</head>', 1)
              p.write_text(s)
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "style: load typography overrides"
          git push origin HEAD:feature/figma-refinement
