name: unify-css-and-prep-delivery

on:
  push:
    branches:
      - chore/unify-css-seo-gtm

permissions:
  contents: write

jobs:
  unify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unify CSS and prepare delivery files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          order = [
              'css/styles.css',
              'css/typography.css',
              'css/prize-refinement.css',
              'css/prize-sizing.css',
              'css/qa-refinement-2.css',
              'css/benefits-icon-alignment.css',
              'css/referrals-desktop-tuning.css',
              'css/layout-responsive-v2.css',
              'css/member-image-fix.css',
              'css/mobile-figma.css',
              'css/mobile-finetune.css',
              'css/final-polish.css',
              'css/hero-refinement.css',
          ]

          sections = []
          for path_str in order:
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'^\s*@import[^;]+;\s*$', '', text, flags=re.M)
              sections.append(f'\n\n/* ===== {path.name} ===== */\n{text.strip()}\n')

          Path('css/styles.css').write_text(''.join(sections).lstrip(), encoding='utf-8')

          for css in Path('css').glob('*.css'):
              if css.name != 'styles.css':
                  css.unlink()

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          # One stylesheet only.
          html = re.sub(r'\n\s*<link rel="stylesheet" href="css/(?:typography|hero-refinement)\.css"\s*/>', '', html)

          # SEO metadata.
          html = html.replace(
              '<title>Interlagos te espera · ACA te lleva</title>\n  <meta name="description" content="Meté primera y participá por un viaje a Brasil, todo pago." />',
              '<title>Viajá a Interlagos con ACA | Sorteo para socios y nuevos socios</title>\n'
              '  <meta name="description" content="Actualizá tus datos o asociate al Automóvil Club Argentino, sumá chances y participá por un viaje a Interlagos para dos personas." />\n'
              '  <link rel="canonical" href="https://www.aca.org.ar/aca/socios/asociacion/?id=3539" />\n'
              '  <meta property="og:type" content="website" />\n'
              '  <meta property="og:site_name" content="Automóvil Club Argentino" />\n'
              '  <meta property="og:title" content="Interlagos te espera · ACA te lleva" />\n'
              '  <meta property="og:description" content="Sumá chances y participá por un viaje a Interlagos para dos personas." />\n'
              '  <meta property="og:url" content="https://www.aca.org.ar/aca/socios/asociacion/?id=3539" />\n'
              '  <meta name="twitter:card" content="summary" />'
          )

          # GTM as high as possible in head.
          gtm_head = '''  <!-- Google Tag Manager -->\n  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\n  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\n  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=\n  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n  })(window,document,'script','dataLayer','GTM-N66LS8');</script>\n  <!-- End Google Tag Manager -->\n'''
          if 'GTM-N66LS8' not in html:
              html = html.replace('  <meta charset="utf-8" />\n', '  <meta charset="utf-8" />\n' + gtm_head)

          gtm_body = '''  <!-- Google Tag Manager (noscript) -->\n  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N66LS8" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>\n  <!-- End Google Tag Manager (noscript) -->\n'''
          if 'googletagmanager.com/ns.html?id=GTM-N66LS8' not in html:
              html = html.replace('<body>\n', '<body>\n' + gtm_body)

          index.write_text(html, encoding='utf-8')

          # Real legal links in footer.
          js = Path('js/main.js')
          code = js.read_text(encoding='utf-8')
          code = code.replace(
              '<span>Bases y Condiciones</span>',
              '<a href="https://www.aca.org.ar/condiciones/campana/viaja-a-interlagos/" target="_blank" rel="noopener noreferrer">Bases y Condiciones</a>'
          )
          js.write_text(code, encoding='utf-8')
          PY

      - name: Commit unified delivery version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: unify CSS and add SEO GTM legal links" || exit 0
          git push
