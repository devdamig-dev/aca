name: Convert supplied campaign image

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  convert:
    if: contains(github.event.head_commit.message, 'chore: convert supplied campaign image')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Convert supplied PNG to WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path('assets/images/Frame 25 (2).png')
          dst = Path('assets/images/campaign-fans.webp')

          if not src.exists():
              raise SystemExit(f'Missing source image: {src}')

          with Image.open(src) as im:
              if im.mode not in ('RGB', 'RGBA'):
                  im = im.convert('RGBA' if 'transparency' in im.info else 'RGB')
              im.save(dst, 'WEBP', quality=86, method=6)

          print(f'Created {dst} from {src}')
          PY

      - name: Point both paths to the new asset
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('index.html'): [
                  ('assets/images/join-fans.webp', 'assets/images/campaign-fans.webp'),
              ],
              Path('css/member-image-fix.css'): [
                  ("../assets/images/join-fans.webp", "../assets/images/campaign-fans.webp"),
              ],
          }

          for path, pairs in replacements.items():
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit generated asset and references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/campaign-fans.webp index.html css/member-image-fix.css
          git diff --cached --quiet && exit 0
          git commit -m "fix: use supplied campaign image"
          git push
